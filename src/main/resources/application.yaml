spring:
  application:
    name: mcp-gateway-jdk
  datasource:
    url: jdbc:postgresql://localhost:5432/mcp_gateway
    username: songchenyang
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  data:
    redis:
      host: localhost
      port: 6379
  ai:
    mcp:
      client:
        streamable-http:
          connections:
            demo:
              url: http://localhost:3001/mcp
      server:
        protocol: STREAMABLE   # Streamable HTTP（SSE 已废弃）；选 STATELESS 则无状态
        type: SYNC             # SYNC（默认）/ ASYNC，决定注解方法用同步还是响应式
        name: pacvue-mcp-gateway
        version: 1.0.0
        annotation-scanner:
          enabled: true        # 自动扫描 @McpTool 注解的 bean（默认开启）

gateway:
  upstreams:
    - alias: ads
      url: http://localhost:8081/mcp
      transport: streamable-http
      timeout: 10s
      required-scope: ads.read
      tools:
        include: [query_campaign, list_campaigns]
      enabled: true
      auth:
        type: header
        name: X-Api-Key
        value: ${ADS_MCP_KEY:placeholder}

    - alias: report
      url: http://localhost:8082/mcp
      transport: streamable-http
      timeout: 30s
      required-scope: report.read
      tools:
        include: [export_report]
      enabled: true
      auth:
        type: none

  security:
    enabled: true   # 本地调试默认关闭，生产改 true
    api-keys:
      sk-demo-001: tenant-001
      sk-demo-002: tenant-002

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: always
